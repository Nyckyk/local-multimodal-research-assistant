cases:
  - case_id: hallmarks_document_summary
    pdf_filename: hall marks of aging.pdf
    pdf_page: null
    question: Summarise the main findings of this paper.
    expected_response_type: rag_summary
    required_facts:
      - review
      - nine hallmarks
      - Genomic instability
      - Telomere attrition
      - Epigenetic alterations
      - Loss of proteostasis
      - Deregulated nutrient-sensing
      - Mitochondrial dysfunction
      - Cellular senescence
      - Stem cell exhaustion
      - Altered intercellular communication
    prohibited_facts:
      - inflammation as an original hallmark
    expected_structured_fields:
      primary: [Genomic instability, Telomere attrition, Epigenetic alterations, Loss of proteostasis]
      antagonistic: [Deregulated nutrient-sensing, Mitochondrial dysfunction, Cellular senescence]
      integrative: [Stem cell exhaustion, Altered intercellular communication]
      minimum_pages: 3
      minimum_chunks: 5
    allowed_uncertainty: []
    timeout: 180
    maximum_retry_count: 1

